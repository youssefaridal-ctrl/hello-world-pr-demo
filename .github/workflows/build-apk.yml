name: Build APK

on:
  push:
    branches:
      - claude/android-budget-tracker-dr2f8y
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: budgetmalin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release
        if: github.ref == 'refs/heads/claude/android-budget-tracker-dr2f8y'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: BudgetMalin (APK de test)
          body: >
            APK de debug généré automatiquement depuis le dernier commit de
            la branche claude/android-budget-tracker-dr2f8y. Pour l'installer,
            téléchargez le fichier ci-dessous sur votre téléphone Android et
            autorisez l'installation depuis une source inconnue si demandé.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
